name: Guilly staging monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_alerts:
        description: Send clearly labeled failure and completion test emails
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: guilly-staging-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate --schema schema.prisma
      - name: Validate isolated staging lifecycle
        run: node run.cjs
        env:
          GUILLY_STAGING_ENV: ${{ secrets.GUILLY_STAGING_ENV }}
          GUILLY_MONITOR_ALERT_SELFTEST: ${{ inputs.test_alerts && '1' || '0' }}
      - name: Notify hosted workflow failure
        if: failure()
        run: node failure.cjs
        env:
          GUILLY_STAGING_ENV: ${{ secrets.GUILLY_STAGING_ENV }}
